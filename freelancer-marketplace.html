<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillBridge — Freelancer Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-bg:#FBFAF8;
    --surface:#FFFFFF;
    --surface-2:#F3F1ED;
    --line:#E4E0D8;
    --line-soft:#ECE9E2;
    --violet:#6A4FE0;
    --violet-light:#EFEAFD;
    --violet-soft:#6A4FE0;
    --coral:#FF6B5B;
    --mint:#1F9D72;
    --text:#211F2B;
    --text-dim:#6B677A;
    --text-faint:#9A96A8;
    --white:#FFFFFF;
    --radius:10px;
    --radius-lg:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:var(--ink-bg);
    color:var(--text);
    line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', serif; font-optical-sizing:auto;}
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none;}
  img{max-width:100%; display:block;}
  .app{min-height:100vh; display:flex; flex-direction:column;}

  /* ===== Top bar ===== */
  .topbar{
    background:rgba(255,255,255,.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 32px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:50;
  }
  .brand{display:flex; align-items:center; gap:10px; font-size:19px; font-weight:600;}
  .brand .mark{
    width:32px; height:32px; border-radius:9px;
    background:linear-gradient(135deg, var(--violet) 0%, var(--coral) 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; color:var(--white); font-size:17px;
  }
  .nav-links{display:flex; gap:24px; align-items:center; font-size:14px;}
  .nav-links a{opacity:.8; transition:opacity .15s; color:var(--text-dim);}
  .nav-links a:hover{opacity:1; color:var(--text);}
  .role-switch{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:9px; border:1px solid var(--line);}
  .role-switch button{padding:6px 14px; border-radius:6px; font-size:13px; color:var(--text-dim); background:transparent;}
  .role-switch button.active{background:var(--violet); color:var(--white); font-weight:600;}

  .container{max-width:1160px; margin:0 auto; padding:0 24px; width:100%;}
  main{flex:1;}

  /* ===== Hero ===== */
  .hero{
    background:
      radial-gradient(ellipse 700px 400px at 15% -10%, rgba(124,92,252,.14), transparent 60%),
      radial-gradient(ellipse 600px 400px at 100% 0%, rgba(255,107,91,.1), transparent 60%),
      var(--ink-bg);
    padding:64px 0 56px; border-bottom:1px solid var(--line);
  }
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--violet-soft); font-weight:700; margin-bottom:16px;}
  .eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--coral);}
  .hero h1{font-size:46px; font-weight:600; line-height:1.12; margin-bottom:16px; max-width:680px;}
  .hero h1 em{font-style:italic; color:var(--violet-soft);}
  .hero p.lead{font-size:16px; color:var(--text-dim); max-width:540px; margin-bottom:28px;}

  .search-bar{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:8px; display:flex; gap:8px; max-width:640px;
  }
  .search-bar input{flex:1; background:transparent; border:none; color:var(--text); font-size:14px; padding:10px 12px; outline:none;}
  .search-bar input::placeholder{color:var(--text-faint);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:9px; font-size:14px; font-weight:600; transition:transform .15s ease, box-shadow .15s ease, opacity .15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--violet); color:var(--white);}
  .btn-primary:hover{box-shadow:0 8px 22px rgba(124,92,252,.4);}
  .btn-coral{background:var(--coral); color:var(--white);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn-outline:hover{border-color:var(--violet);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px; font-size:13px;}
  .quick-tags{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .quick-tag{font-size:12px; color:var(--text-dim); border:1px solid var(--line); padding:6px 12px; border-radius:20px;}

  .stat-row{display:flex; gap:32px; margin-top:36px;}
  .stat .num{font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--text);}
  .stat .lbl{font-size:12px; color:var(--text-faint);}

  /* ===== Sections ===== */
  .section{padding:52px 0;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px;}
  .section-head h2{font-size:25px; font-weight:600;}
  .section-head .sub{color:var(--text-faint); font-size:13px; margin-top:4px;}

  .cat-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}

  .feature-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;}
  .feature-card:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(33,31,43,.1);}
  .feature-card img{width:100%; height:140px; object-fit:cover; transition:transform .4s ease;}
  .feature-card:hover img{transform:scale(1.06);}
  .feature-body{padding:16px;}
  .feature-body h3{font-size:15px; font-weight:700; margin-bottom:6px;}
  .feature-body p{font-size:13px; color:var(--text-dim);}
  .cat-pill{
    flex-shrink:0; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:30px; padding:9px 16px; font-size:13px; color:var(--text-dim);
    transition:border-color .15s, color .15s, background .15s;
  }
  .cat-pill:hover, .cat-pill.sel{border-color:var(--violet); color:var(--text); background:var(--violet-light);}
  .cat-pill .em{font-size:15px;}

  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .freelancer-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    overflow:hidden; display:flex; flex-direction:column; transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
  }
  .freelancer-card:hover{transform:translateY(-4px); border-color:var(--violet); box-shadow:0 16px 36px rgba(33,31,43,.12);}
  .fc-cover{height:96px; position:relative; overflow:hidden;}
  .fc-cover img{width:100%; height:100%; object-fit:cover; transition:transform .4s ease;}
  .freelancer-card:hover .fc-cover img{transform:scale(1.06);}
  .fc-avatar{
    width:56px; height:56px; border-radius:50%; border:3px solid var(--surface);
    background:linear-gradient(140deg, var(--violet) 0%, var(--coral) 100%);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:19px; color:var(--white);
    position:absolute; left:16px; bottom:-26px;
  }
  .fc-body{padding:34px 16px 16px;}
  .fc-name{font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .fc-role{font-size:12px; color:var(--text-faint); margin:2px 0 10px;}
  .verified{width:14px;height:14px; border-radius:50%; background:var(--mint); color:var(--ink-bg); display:flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0; animation:pulseDot 2.4s ease-in-out infinite;}
  .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .tag{background:var(--violet-light); color:var(--violet-soft); font-size:11px; font-weight:600; padding:4px 9px; border-radius:6px;}
  .fc-foot{display:flex; justify-content:space-between; align-items:center; font-size:13px; border-top:1px solid var(--line-soft); padding-top:12px; margin-top:auto;}
  .rating{color:#F2B84B; font-weight:600;}
  .rate{font-weight:700; color:var(--text);}
  .bookmark-btn{
    position:absolute; right:14px; top:14px; width:30px; height:30px; border-radius:50%;
    background:rgba(33,31,43,.55); border:1px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center;
    color:var(--white); font-size:13px; z-index:2; transition:background .2s, transform .15s;
  }
  .bookmark-btn:hover{transform:scale(1.1);}
  .bookmark-btn.active{background:var(--coral); border-color:var(--coral);}

  /* ===== Search / directory page ===== */
  .search-layout{display:grid; grid-template-columns:240px 1fr; gap:26px; padding:28px 0;}
  .filters-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; align-self:start; position:sticky; top:80px;}
  .filters-card h3{font-size:14px; margin-bottom:16px;}
  .filter-group{margin-bottom:20px;}
  .filter-group label{font-size:12px; font-weight:700; color:var(--text-dim); display:block; margin-bottom:10px;}
  .cat-list{display:flex; flex-direction:column; gap:8px;}
  .cat-item{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-dim); padding:7px 9px; border-radius:7px; cursor:pointer; transition:background .15s, color .15s;}
  .cat-item:hover, .cat-item.sel{background:var(--violet-light); color:var(--text);}
  .cat-item .count{font-size:11px; color:var(--text-faint);}
  .chip-list{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{border:1px solid var(--line); border-radius:16px; padding:5px 12px; font-size:12px; color:var(--text-dim); transition:border-color .15s, color .15s;}
  .chip.sel{background:var(--violet); border-color:var(--violet); color:var(--white);}

  /* ===== Profile page ===== */
  .profile-head{background:linear-gradient(180deg, var(--violet-light), var(--ink-bg)); border-bottom:1px solid var(--line); padding:0;}
  .profile-cover{height:160px; background-size:cover; background-position:center; position:relative;}
  .profile-cover::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(251,250,248,0) 0%, rgba(251,250,248,.95) 100%);}
  .profile-top{display:flex; gap:20px; align-items:flex-end; padding:0 0 24px; margin-top:-44px; position:relative;}
  .avatar-lg{width:96px;height:96px; border-radius:50%; border:4px solid var(--ink-bg); background:linear-gradient(140deg, var(--violet) 0%, var(--coral) 100%); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:32px; font-weight:600; color:var(--white); flex-shrink:0;}
  .profile-tabs{display:flex; gap:24px; border-bottom:1px solid var(--line);}
  .ptab{padding:10px 2px; font-size:14px; color:var(--text-faint); border-bottom:2px solid transparent; font-weight:500;}
  .ptab.active{color:var(--violet-soft); border-color:var(--violet); font-weight:600;}
  .profile-body{display:grid; grid-template-columns:1fr 320px; gap:28px; padding:28px 0;}
  .info-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; margin-bottom:18px;}
  .info-card h3{font-size:15px; margin-bottom:12px;}
  .portfolio-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .portfolio-item{border-radius:10px; overflow:hidden; border:1px solid var(--line); position:relative;}
  .portfolio-item img{width:100%; height:110px; object-fit:cover; transition:transform .3s ease;}
  .portfolio-item:hover img{transform:scale(1.06);}
  .portfolio-item .cap{font-size:11px; color:var(--text-dim); padding:8px 10px;}
  .review-item{border-bottom:1px solid var(--line-soft); padding:14px 0;}
  .review-item:last-child{border-bottom:none;}
  .side-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; position:sticky; top:80px;}

  /* ===== Dashboards ===== */
  .dash-layout{display:grid; grid-template-columns:230px 1fr; min-height:calc(100vh - 61px);}
  .sidebar{background:var(--surface); border-right:1px solid var(--line); padding:24px 16px;}
  .side-link{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:14px; color:var(--text-dim); margin-bottom:2px; font-weight:500; transition:background .2s, color .2s, padding-left .2s;}
  .side-link:hover{padding-left:16px;}
  .side-link .dot{width:6px;height:6px;border-radius:50%; background:var(--text-faint);}
  .side-link.active{background:var(--violet-light); color:var(--violet-soft); font-weight:600;}
  .side-link.active .dot{background:var(--violet);}
  .dash-main{padding:28px 32px;}
  .dash-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
  .dash-head h2{font-size:22px;}
  .card-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; transition:transform .2s, box-shadow .2s;}
  .stat-card:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(33,31,43,.1);}
  .stat-card .num{font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--text);}
  .stat-card .lbl{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; margin-bottom:18px;}
  .panel h3{font-size:15px; margin-bottom:14px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--line-soft);}
  td{padding:12px 10px; border-bottom:1px solid var(--line-soft);}
  .badge{font-size:11px; font-weight:600; padding:3px 9px; border-radius:6px;}
  .badge.active{background:rgba(63,214,160,.15); color:var(--mint);}
  .badge.pending{background:rgba(242,184,75,.15); color:#F2B84B;}
  .badge.closed{background:var(--surface-2); color:var(--text-faint);}

  .doc-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft); transition:background .2s;}
  .doc-row:hover{background:var(--surface-2);}
  .doc-row:last-child{border-bottom:none;}

  .chat-shell{display:grid; grid-template-columns:280px 1fr; height:540px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;}
  .chat-list{border-right:1px solid var(--line); overflow-y:auto;}
  .chat-list-item{display:flex; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line-soft); cursor:pointer; transition:background .15s;}
  .chat-list-item:hover, .chat-list-item.sel{background:var(--violet-light);}
  .chat-panel{display:flex; flex-direction:column;}
  .chat-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  .chat-window{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;}
  .msg{max-width:65%; padding:10px 14px; border-radius:12px; font-size:13px;}
  .msg.me{background:var(--violet); color:var(--white); align-self:flex-end;}
  .msg.them{background:var(--surface-2); color:var(--text); align-self:flex-start;}
  .chat-input-row{display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line);}
  .chat-input-row input{flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--text); outline:none;}

  .stars-input{display:flex; gap:6px; font-size:22px; color:var(--line); margin:12px 0;}
  .stars-input span.sel{color:#F2B84B;}

  footer{background:var(--surface); border-top:1px solid var(--line); color:var(--text-faint); padding:32px 0; font-size:13px; margin-top:auto;}
  .footer-grid{display:flex; justify-content:space-between; align-items:center;}

  .hidden{display:none !important;}

  /* ===== Animations ===== */
  @keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes pulseDot{ 0%,100%{box-shadow:0 0 0 0 rgba(63,214,160,.5);} 50%{box-shadow:0 0 0 5px rgba(63,214,160,0);} }
  #mainArea{animation:fadeIn .35s ease;}
  .hero .eyebrow{animation:fadeUp .5s ease both;}
  .hero h1{animation:fadeUp .55s ease both .05s;}
  .hero p.lead{animation:fadeUp .6s ease both .1s;}
  .hero .search-bar{animation:fadeUp .6s ease both .15s;}
  .hero .quick-tags{animation:fadeUp .6s ease both .2s;}
  .hero .stat-row{animation:fadeUp .6s ease both .25s;}
  .reveal-stagger > *{opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease;}
  .reveal-stagger.in > *{opacity:1; transform:translateY(0);}
  .reveal-stagger.in > *:nth-child(1){transition-delay:.02s;}
  .reveal-stagger.in > *:nth-child(2){transition-delay:.08s;}
  .reveal-stagger.in > *:nth-child(3){transition-delay:.14s;}
  .reveal-stagger.in > *:nth-child(4){transition-delay:.2s;}
  .reveal-stagger.in > *:nth-child(5){transition-delay:.26s;}
  .reveal-stagger.in > *:nth-child(6){transition-delay:.32s;}

  @media(max-width:900px){
    .grid-3{grid-template-columns:repeat(2,1fr);}
    .search-layout, .dash-layout, .profile-body{grid-template-columns:1fr;}
    .card-row{grid-template-columns:repeat(2,1fr);}
    .dash-layout{grid-template-columns:1fr;}
    .sidebar{display:flex; flex-direction:row; overflow-x:auto; gap:4px; border-right:none; border-bottom:1px solid var(--line); padding:12px 16px; position:sticky; top:61px; z-index:30;}
    .side-link{white-space:nowrap; flex-shrink:0;}
    .filters-card, .side-card{position:static;}
    .chat-shell{grid-template-columns:1fr; height:auto;}
    .chat-list{max-height:200px;}
  }
  @media(max-width:640px){
    .topbar{padding:12px 16px;}
    .brand{font-size:16px;}
    .nav-links > a{display:none;}
    .role-switch button{padding:6px 9px; font-size:11px;}
    .container{padding:0 16px;}
    .hero{padding:36px 0 40px;}
    .hero h1{font-size:28px;}
    .hero p.lead{font-size:14px;}
    .section{padding:36px 0;}
    .section-head{flex-direction:column; gap:6px;}
    .grid-3{grid-template-columns:1fr;}
    .stat-row{flex-wrap:wrap; gap:18px;}
    .card-row{grid-template-columns:repeat(2,1fr); gap:10px;}
    .dash-main{padding:18px 16px;}
    .dash-head{flex-direction:column; align-items:flex-start; gap:10px;}
    table{display:block; overflow-x:auto; white-space:nowrap;}
    .portfolio-grid{grid-template-columns:1fr;}
    .footer-grid{flex-direction:column; gap:6px; text-align:center;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="#" class="brand" onclick="goTo('landing')"><span class="mark">S</span> SkillBridge</a>
    <div class="nav-links">
      <a href="#" onclick="goTo('search')">Browse freelancers</a>
      <a href="#" onclick="goTo('search')">Categories</a>
      <div class="role-switch">
        <button class="active" data-role="client" onclick="setRole('client')">Client</button>
        <button data-role="freelancer" onclick="setRole('freelancer')">Freelancer</button>
        <button data-role="admin" onclick="setRole('admin')">Admin</button>
      </div>
    </div>
  </div>
  <main id="mainArea"></main>
  <footer id="siteFooter">
    <div class="container footer-grid">
      <div>© 2026 SkillBridge. Built for great work.</div>
      <div>Privacy · Terms · Contact</div>
    </div>
  </footer>
</div>

<script>
/* ===================== MOCK DATA ===================== */
const categories = [
  {n:"Web Development", c:142, em:"💻"}, {n:"Graphic Design", c:98, em:"🎨"},
  {n:"Content Writing", c:76, em:"✍️"}, {n:"Video Editing", c:54, em:"🎬"},
  {n:"UI/UX Design", c:61, em:"📱"}, {n:"Digital Marketing", c:47, em:"📈"},
  {n:"Voice Over", c:22, em:"🎙️"}, {n:"Photography", c:31, em:"📷"},
];

const portfolioImgs = {
  "Web Development":"https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=500&q=60",
  "Graphic Design":"https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=500&q=60",
  "Content Writing":"https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=500&q=60",
  "Video Editing":"https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=500&q=60",
  "UI/UX Design":"https://images.unsplash.com/photo-1559028012-481c04fa702d?auto=format&fit=crop&w=500&q=60",
};

function freelancerCardHTML(f){
  const img = portfolioImgs[f.cat] || portfolioImgs["Web Development"];
  const isBookmarked = state.bookmarks.includes(f.id);
  return `
  <div class="freelancer-card">
    <div class="fc-cover">
      <img src="${img}" alt="">
      <button class="bookmark-btn ${isBookmarked?'active':''}" onclick="toggleBookmark(event,${f.id})">${isBookmarked?'★':'☆'}</button>
      <div class="fc-avatar">${f.initials}</div>
    </div>
    <div class="fc-body" style="display:flex; flex-direction:column; flex:1;">
      <div class="fc-name">${f.name} ${f.verified?'<span class="verified">✓</span>':''}</div>
      <div class="fc-role">${f.role}</div>
      <div class="tag-row">${f.skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
      <div class="fc-foot">
        <span class="rating">★ ${f.rating} <span style="color:var(--text-faint); font-weight:400;">(${f.reviews})</span></span>
        <span class="rate">₹${f.rate}${f.rateType==='hr'?'/hr':f.rateType==='word'?'/word':' fixed'}</span>
      </div>
      <button class="btn btn-primary btn-block btn-sm" style="margin-top:14px;" onclick="viewFreelancer(${f.id})">View profile</button>
    </div>
  </div>`;
}

function viewFreelancer(id){ state.selectedFreelancer = freelancers.find(f=>f.id===id); goTo('profile'); }
function toggleBookmark(e, id){
  e.stopPropagation();
  state.bookmarks = state.bookmarks.includes(id) ? state.bookmarks.filter(x=>x!==id) : [...state.bookmarks, id];
  render();
}

function openReviewModal(){ document.getElementById('reviewBox').classList.toggle('hidden'); }
function setStar(n){
  state.rating = n;
  document.querySelectorAll('#starsInput span').forEach(s=>s.classList.toggle('sel', +s.dataset.n <= n));
}
function submitReview(){
  if(!state.rating){ alert("Please select a star rating first."); return; }
  alert("Thanks! Your review has been submitted and the freelancer's rating will update automatically.");
  state.rating = 0;
  goTo('profile');
}

/* ===================== ROUTER ===================== */
function goTo(page){ state.page = page; render(); window.scrollTo({top:0, behavior:'smooth'}); }

function setRole(role){
  state.role = role;
  document.querySelectorAll('.role-switch button').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
  if(role==='client') goTo('clientDash');
  if(role==='freelancer') goTo('freelancerDash');
  if(role==='admin') goTo('adminDash');
}

function render(){
  const area = document.getElementById('mainArea');
  const footer = document.getElementById('siteFooter');
  const page = state.page || 'landing';
  const dashPages = ['clientDash','freelancerDash','adminDash'];
  footer.classList.toggle('hidden', dashPages.includes(page) || page==='chat');

  switch(page){
    case 'landing': area.innerHTML = renderLanding(); break;
    case 'search': area.innerHTML = renderSearch(); break;
    case 'profile': area.innerHTML = renderProfile(); break;
    case 'chat': area.innerHTML = renderChat(); break;
    case 'clientDash': area.innerHTML = renderClientDash(); break;
    case 'freelancerDash': area.innerHTML = renderFreelancerDash(); break;
    case 'adminDash': area.innerHTML = renderAdminDash(); break;
    default: area.innerHTML = renderLanding();
  }

  area.style.animation = 'none';
  requestAnimationFrame(()=>{ area.style.animation = ''; });
  setupRevealObserver();
}

function setupRevealObserver(){
  const targets = document.querySelectorAll('.reveal-stagger');
  if(!targets.length) return;
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add('in'); obs.unobserve(entry.target); }
    });
  }, {threshold:0.1});
  targets.forEach(t=>obs.observe(t));
}

render();
</script>
